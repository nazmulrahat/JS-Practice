<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>JS HW</title>
</head>

<body id="body">
    <main>


        <section class="flex flex-col gap-4 items-center m-40">

<h1 class="my-4 text-xl font-bold" id="text">Light off kora asa</h1>
            <img id="lightImage" class="w-40" src="/l-off.png" alt="">
            <div class="flex gap-32">
                <button onclick="document.getElementById('lightImage').src='/l-on.png'; document.getElementById('text').innerText='Light on kora hoisa'"
                    class="py-2 px-3 cursor-pointer hover:bg-yellow-400 bg-yellow-300 text-black rounded-md border font-semibold">Turn
                    on the light</button>
                <button onclick="document.getElementById('lightImage').src='/l-off.png' ; document.getElementById('text').innerText='Light off kora hoisa'"
                    class="py-2 cursor-pointer px-3 hover:bg-gray-400 bg-gray-300 text-black rounded-md border font-semibold">Turn
                    off the light</button>
            </div>
            
 <button onclick="document.getElementById('body').style.backgroundColor='skyblue'"
                    class="py-2 px-3 cursor-pointer hover:bg-gray-200 bg-white text-black rounded-md border font-semibold">  Change Background </button>
                    <button onclick="document.getElementById('body').style.backgroundColor='white'"
                    class="py-2 px-3 cursor-pointer hover:bg-gray-200 bg-whit text-black rounded-md border font-semibold">  Restore Background </button>
        </section>





    </main>
    <script src="js.js"></script>
</body>

</html>
